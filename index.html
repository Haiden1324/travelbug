<style>
:root{
  /* ===== TravelBug design tokens: monochrome, one tiny red brand mark ===== */
  --bg:#0c0c0d; --bg2:#121214; --card:#161618; --card2:#1e1e21; --line:#2b2b30;
  --text:#f4f4f5; --mute:#8b8b93; --on-accent:#0c0c0d;
  --accent:var(--text); --accent2:#8b8b93; --blue:#a1a1aa; --good:#e4e4e7; --warn:#a1a1aa;
  --brand:#d92d27; --bug-ink:#0a0a0b; --bad:#e5534b;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-lg:20px; --fs-xl:44px;
  --sp-1:6px; --sp-2:10px; --sp-3:14px; --sp-4:18px; --sp-5:24px;
  --radius:16px; --radius-sm:12px; --shadow:0 1px 2px rgba(0,0,0,.4);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f5f5f6; --bg2:#ffffff; --card:#ffffff; --card2:#f0f0f2; --line:#e2e2e6;
  --text:#111113; --mute:#6b6b74; --on-accent:#ffffff;
  --accent2:#6b6b74; --blue:#52525b; --good:#27272a; --warn:#52525b;
  --bug-ink:#111113; --bad:#c9372f; --shadow:0 1px 2px rgba(0,0,0,.06);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-base)/1.45 var(--font)}
body{min-height:100vh;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:15px;color:var(--mute);font-weight:600}
a{color:var(--accent)} button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.main{padding:0 16px calc(96px + var(--safe-b));max-width:1100px;width:100%;margin:0 auto}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 0 10px;background:linear-gradient(var(--bg) 80%,transparent)}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:18px;letter-spacing:-.02em}
.logo{width:18px;height:18px;display:grid;place-items:center;color:var(--mute);flex:none}
.logo svg{width:18px;height:18px;display:block}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mute);letter-spacing:0}
.spacer{flex:1}
.tripsel{max-width:46vw;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-height:42px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:slide 1s linear infinite;display:none}
.bar.on{display:block}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11px;color:var(--mute);border:0;background:none;border-radius:12px;min-height:50px;cursor:pointer}
.tab.on{color:var(--accent)}
.navbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:0;background:none;color:var(--mute);width:100%;text-align:left;cursor:pointer;font-weight:600}
.navbtn.on{background:var(--card);color:var(--accent)}
@media(min-width:900px){
  .app{grid-template-columns:230px 1fr}
  .side{display:block;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--bg2)}
  .side .brand{padding:0 8px 22px}
  .tabbar{display:none} .main{padding-bottom:40px}
  .top .brand{display:none}
}

/* components */
.page-head{display:flex;align-items:center;gap:10px;margin:8px 0 14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{background:var(--card)}
.big{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.03em;line-height:1}
.mute{color:var(--mute)} .sm{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;text-decoration:none;color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad)} .btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.ghost{background:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mute);white-space:nowrap}
.badge.good{background:var(--text);color:var(--on-accent)} .badge.warn{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--mute)}
.badge.bad{background:var(--card2);color:var(--bad)} .badge.info{background:var(--card2);color:var(--text)}
.progress{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;position:relative}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--text)}
.progress.over>i{background:var(--bad)}
.progress .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.list>*{border-top:1px solid var(--line);padding:12px 0}
.list>*:first-child{border-top:0;padding-top:0} .list>*:last-child{padding-bottom:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;color:var(--mute)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{flex:1;min-width:130px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:5px}
.field{margin-bottom:12px} .field.hidden{display:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} .fgrid .full{grid-column:1/-1}
@media(max-width:480px){.fgrid{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
.stat{display:flex;flex-direction:column}
.stat b{font-size:22px;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.bars .br{display:grid;grid-template-columns:110px 1fr 76px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.bars .progress{height:8px}
.route{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 0 8px}
.stop{flex:none;text-align:center;padding:10px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);min-width:96px}
.arrow{color:var(--mute);flex:none}
.day{padding:0;overflow:hidden}
.day-h{padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.daynum{width:50px;height:50px;border-radius:14px;background:var(--card2);display:grid;place-items:center;text-align:center;line-height:1.05;flex:none}
.daynum b{font-size:18px;display:block} .daynum span{font-size:10px;color:var(--mute);text-transform:uppercase}
.day.travel .daynum{background:var(--text);color:var(--on-accent)} .day.travel{border-color:var(--mute)}
.day.today{border-color:var(--accent)}
.day-b{padding:6px 16px 14px}
details.act{border-top:1px solid var(--line);padding:2px 0}
details.act:first-child{border-top:0}
details.act summary{list-style:none;display:flex;gap:10px;align-items:center;padding:12px 0;cursor:pointer;min-height:44px}
details.act summary::-webkit-details-marker{display:none}
.time{width:46px;flex:none;color:var(--accent);font-weight:700;font-size:13px}
.det{padding:0 0 12px 56px} .det p{margin:4px 0}
.tl{position:relative;padding-left:20px;border-left:2px solid var(--line);margin-left:6px}
.tl .ev{position:relative;padding:0 0 16px 10px}
.tl .ev:before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:11px;color:var(--mute);padding:4px 0}
.cal .cell{aspect-ratio:1;min-height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:5px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--text)}
.cal .cell.out{opacity:.35} .cal .cell.trip{background:var(--card2)} .cal .cell.today{border-color:var(--accent)} .cal .cell.sel{outline:2px solid var(--blue)}
.cal .cell i{font-style:normal;font-size:10px;color:var(--accent);font-weight:700}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--on-accent)}
.chk.on{background:var(--good);border-color:var(--good)}
.done{opacity:.55;text-decoration:line-through}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.ref{background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;display:inline-flex;gap:8px;align-items:center}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(3,6,14,.7);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + var(--safe-b))}
@media(min-width:700px){.scrim{align-items:center}.modal{border-radius:22px}}
.modal h2{margin-bottom:14px}
.sheetlist .navbtn{border:1px solid var(--line);margin-bottom:8px;background:var(--card2)}
.toasts{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--safe-b));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media(min-width:900px){.toasts{bottom:24px}}
.toast{pointer-events:auto;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--text);padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);max-width:520px;animation:pop .2s}
.toast.err{border-left-color:var(--bad)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.skeleton{height:120px;border-radius:var(--radius);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
table.t{width:100%;border-collapse:collapse;font-size:14px} table.t td,table.t th{padding:8px 6px;text-align:left;border-top:1px solid var(--line)}
</style>
<script>
(function(){
  /* Diagnostic: find the first line of any inline script that fails to parse. */
  function probe(){
    var out=[], ss=document.scripts, i, t, lines, n, msg, k;
    for(i=0;i<ss.length;i++){
      t=ss[i].textContent; if(!t || t.length<2000) continue;
      lines=t.split('\n');
      out.push('script '+(i+1)+': '+t.length+' chars, '+lines.length+' lines');
      for(n=1;n<=lines.length;n++){
        try{ new Function(lines.slice(0,n).join('\n')); }
        catch(e){
          msg=String(e.message);
          if(!/Unexpected identifier/.test(msg)) continue;
          out.push('first hard error at line '+n+': '+msg);
          for(k=Math.max(0,n-3);k<n;k++) out.push((k+1)+': '+lines[k].slice(0,200));
          break;
        }
      }
    }
    return out.join('\n');
  }
  function show(msg){
    var v=document.getElementById('view'), d='';
    try{ d=probe(); }catch(x){ d='probe failed: '+x.message; }
    if(v){
      v.innerHTML='<div class="card"><b>TravelBug hit a problem</b><div class="sm mute" style="margin-top:8px;word-break:break-word"></div><pre class="xs mute" style="white-space:pre-wrap;word-break:break-all;margin:8px 0 0"></pre></div>';
      v.querySelector('div.sm').textContent=String(msg); v.querySelector('pre').textContent=d;
    }
  }
  window.addEventListener('error',function(e){show(e.message);});
  window.addEventListener('unhandledrejection',function(e){show(e.reason&&e.reason.message||e.reason);});
})();
</script>

const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const ymd = d => d.toISOString().slice(0,10);
const addDays = (s,n) => ymd(new Date(parseD(s).getTime() + n*864e5));
const diffDays = (a,b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const todayStr = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`; };
const fmtDate = (s,o) => s ? parseD(s).toLocaleDateString('en-AU', Object.assign({weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}, o||{})) : '';
const fmtShort = s => fmtDate(s,{weekday:undefined,year:undefined});
const aud = n => (n == null || isNaN(n)) ? '–' : new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n);
const num = (n,cur) => n === '' || n == null ? '' : new Intl.NumberFormat('en-AU',{maximumFractionDigits:2}).format(n) + (cur ? ' ' + cur : '');
const label = n => n.replace(/ID$/,'').replace(/AUD$/,' (AUD)').replace(/Mins$/,' (mins)').replace(/Url$/,' link').replace(/([a-z])([A-Z])/g,'$1 $2').trim();
const cap = (arr,n) => arr.slice(0,n);
const sum = (arr,f) => arr.reduce((a,x) => a + (Number(f(x)) || 0), 0);
const BADGE = {Booked:'good',Done:'good','Paid in full':'good',Completed:'good',Confirmed:'good',Underway:'info',Planned:'info',Shortlisted:'info','In progress':'info','Deposit paid':'warn',Provisional:'warn',
               Unpaid:'warn',Researching:'',Interested:'',Cancelled:'bad',Skipped:'bad',High:'bad',Medium:'warn',Low:'',Refunded:'info','Added to itinerary':'good',Archived:''};
const badge = t => t ? `<span class="badge ${BADGE[t] || ''}">${esc(t)}</span>` : '';

function tripObj(){ return S.trips.find(t => t.TripID === S.tripId) || null; }
function rec(tab,id){ return (tab === 'Trips' ? S.trips : S.data[tab] || []).find(r => r[IDCOL[tab]] === id); }
function destName(id){ const d = rec('Destinations',id); return d ? d.Name : ''; }
function sorted(arr,key){ return arr.slice().sort((a,b) => String(a[key]||'~').localeCompare(String(b[key]||'~'))); }
function phase(){
  const t = tripObj(); if (!t || !t.StartDate || !t.EndDate) return 'upcoming';
  const d = todayStr(); return d < t.StartDate ? 'upcoming' : d <= t.EndDate ? 'underway' : 'completed';
}
function dests(){ return S.data.Destinations.slice().sort((a,b) => (Number(a.SortOrder)||999) - (Number(b.SortOrder)||999) || String(a.ArrivalDate||'~').localeCompare(String(b.ArrivalDate||'~'))); }
function nights(d){ return d.ArrivalDate && d.DepartureDate ? Math.max(0,diffDays(d.ArrivalDate,d.DepartureDate)) : null; }

/* exchange rates: latest entry per currency for this trip; AUD = 1 */
function rate(cur){
  if (!cur || cur === 'AUD') return 1;
  let best = null;
  S.data.ExchangeRates.forEach(r => { if (r.Currency === cur && Number(r.RateToAUD) > 0 && (!best || String(r.EffectiveDate) >= String(best.EffectiveDate))) best = r; });
  return best ? Number(best.RateToAUD) : null;
}
let missingFx = 0;
function toAud(amount,cur,snapshot){
  if (amount === '' || amount == null) return 0;
  if (snapshot !== '' && snapshot != null && !isNaN(snapshot)) return Number(snapshot);
  const r = rate(cur); if (r == null) { missingFx++; return 0; }
  return Number(amount) * r;
}

/* ---------- server calls ---------- */
/* Two ways to reach the Google Sheet backend:
   1. Inside an Apps Script web app page: google.script.run.
   2. From any other host (GitHub Pages etc.): an anonymous POST to the Apps Script /exec address.
   Way 2 sends no Google cookies, so browser Google accounts (work/school) cannot get in the way. */
const IN_GAS = typeof google !== 'undefined' && !!google.script && !!google.script.run;
function call(fn,...args){
  if (IN_GAS) {
    return new Promise((res,rej) => {
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e)) [fn](...args);
    });
  }
  const url = store('tb_api') || '';
  if (!url) return Promise.reject(new Error('NO_API'));
  return fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn:fn, args:args}) })
    .then(r => r.json())
    .then(j => { if (!j.ok) throw new Error(j.error || 'Server error'); return j.result; });
}
function showApiSetup(note){
  $('#view').innerHTML = `<div class="card stack" style="max-width:560px"><h2>Connect to your TravelBug data</h2>
    <p class="sm mute">Paste your Apps Script web app address (the long link ending in <b>/exec</b>). You only need to do this once on each device.</p>
    ${note ? `<p class="sm" style="color:var(--bad)">${esc(note)}</p>` : ''}
    <input id="apiurl" type="url" inputmode="url" placeholder="Paste the /exec link here" value="${esc(store('tb_api') || '')}">
    <button class="btn pri" data-act="saveApi">Connect</button></div>`;
}
function busy(on){ S.busy += on ? 1 : -1; $('#bar').classList.toggle('on', S.busy > 0); $('#refresh').classList.toggle('spin', S.busy > 0); }
function errMsg(e){
  const m = String(e && e.message || e || 'Something went wrong').replace(/^Error:\s*/,'');
  return m.replace(/^(VALIDATION|CONFLICT|NOT_FOUND|NOT_AUTHORISED):\s*/,'');
}
function toast(msg,err){
  const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), err ? 6000 : 2600);
}
function store(k,v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k,v); } catch(e){ return null; } }

async function loadAll(tripId, quiet){
  busy(true);
  try {
    const r = await call('apiBootstrap', tripId || S.tripId || store('tb_trip') || '');
    applyBootstrap(r, false);
    store('tb_cache', JSON.stringify(r)); store('tb_trip', r.tripId);
    if (!quiet) toast('Up to date');
  } catch(e){
    if (String(e && e.message).includes('NO_API')) { showApiSetup(); return; }
    toast(errMsg(e), true);
    if (!IN_GAS && /Failed to fetch|NetworkError|Load failed/i.test(String(e && e.message))) { showApiSetup('Could not reach that address. Check the link, and that the web app is deployed with access set to Anyone.'); return; }
    if (!S.schema) $('#view').innerHTML = '<div class="card empty"><h2>Could not load your trip data</h2><p class="sm">' + esc(errMsg(e)) + '</p><button class="btn pri" data-act="refresh">Try again</button></div>';
  } finally { busy(false); }
}
function applyBootstrap(r,cached){
  S.schema = r.schema; S.trips = r.trips; S.tripId = r.tripId; S.data = r.data; S.user = r.user; S.loadedAt = r.loadedAt; S.cached = cached;
  S.calMonth = ''; renderChrome(); render();
}

/* conflict-aware save/delete wrappers */
async function saveRecord(tab,r,version){
  busy(true);
  try {
    const saved = await call('apiSave', tab, r, version);
    const arr = tab === 'Trips' ? S.trips : S.data[tab], id = IDCOL[tab], i = arr.findIndex(x => x[id] === saved[id]);
    if (i >= 0) arr[i] = saved; else arr.push(saved);
    return saved;
  } catch(e){
    if (/CONFLICT|NOT_FOUND/.test(String(e.message))) { toast(errMsg(e) + ' Reloading latest data.', true); await loadAll(S.tripId, true); }
    throw e;
  } finally { busy(false); }
}
async function deleteRecord(tab,id){
  const r = rec(tab,id); if (!r) return;
  busy(true);
  try {
    await call('apiDelete', tab, id, r.Version);
    if (tab === 'Trips' || tab === 'Destinations') await loadAll(tab === 'Trips' && id === S.tripId ? '' : S.tripId, true);
    else { S.data[tab] = S.data[tab].filter(x => x[IDCOL[tab]] !== id); }
    toast('Deleted');
  } catch(e){
    toast(errMsg(e), true);
    if (/CONFLICT|NOT_FOUND/.test(String(e.message))) await loadAll(S.tripId, true);
  } finally { busy(false); render(); }
}

const HIDE_FIELDS = new Set(['TripID','CreatedAt','UpdatedAt','UpdatedBy','Version','CompletedAt','CostAUD','AmountAUD']);
function fkOptions(ref){
  if (ref === 'Destinations') return dests().map(d => [d.DestinationID, d.Name]);
  if (ref === 'Bookings') return sorted(S.data.Bookings,'StartDate').map(b => [b.BookingID, `${b.Description}${b.StartDate ? ' · ' + fmtShort(b.StartDate) : ''}`]);
  if (ref === 'Places') return S.data.Places.map(p => [p.PlaceID, p.Name]);

function openForm(tab, existing, defaults, onSaved){
  const cols = S.schema[tab].columns.filter(c => c.name !== IDCOL[tab] && !HIDE_FIELDS.has(c.name));

  const full = new Set(['Notes','Description','TransportNotes','Title','Name','TripName','MapsUrl','WebsiteUrl','ConfirmationUrl']);
  const fields = cols.map(c => {
    const val = v[c.name] == null ? '' : v[c.name], id = 'f_' + c.name, req = c.required ? ' *' : '';
    let inp;

    else if (c.type === 'enum') inp = `<select id="${id}"><option value=""></option>${c.enums.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;

    else if (c.type === 'money') inp = `<input id="${id}" type="number" inputmode="decimal" step="any" ${c.allowNegative ? '' : 'min="0"'} value="${esc(val)}">`;
    else if (c.type === 'fx') inp = `<input id="${id}" type="number" inputmode="decimal" step="any" min="0" value="${esc(val)}" placeholder="auto">`;
    else if (c.type === 'int') inp = `<input id="${id}" type="number" inputmode="numeric" step="1" min="0" value="${esc(val)}">`;
    else if (c.type === 'url') inp = `<input id="${id}" type="url" inputmode="url" placeholder="https:&#47;&#47;" value="${esc(val)}">`;
    else inp = `<input id="${id}" type="text" maxlength="500" value="${esc(val)}">`;
    const lbl = c.name === 'FxRate' ? 'Exchange rate to AUD (blank = automatic)' : c.name === 'RateToAUD' ? 'AUD per 1 unit of currency' : label(c.name);
    return `<div class="field ${full.has(c.name) || c.type === 'longtext' ? 'full' : ''}" data-f="${c.name}"><label for="${id}">${esc(lbl)}${req}</label>${inp}</div>`;
  }).join('');
  showModal(`<h2>${existing ? 'Edit' : 'Add'} ${esc(tabLabel(tab))}</h2><form id="rf" novalidate><div class="fgrid">${fields}</div>
    <div class="row" style="margin-top:8px"><button type="button" class="btn ghost" id="fc" style="flex:1">Cancel</button><button class="btn pri" id="fs" style="flex:2">Save</button></div></form>`);
  const sync = () => {
    if (tab !== 'Itinerary') return;

  };
  if (tab === 'Itinerary') { $('#f_ItemType').addEventListener('change', sync); sync(); }
  $('#fc').onclick = closeModal;
  $('#rf').onsubmit = async ev => {
    ev.preventDefault();
    const out = {}; let bad = '';
    cols.forEach(c => {
      const el = $('#f_' + c.name); if (!el) return;
      const hidden = el.closest('.field').classList.contains('hidden');
      out[c.name] = hidden ? '' : el.value.trim();
      if (c.required && !out[c.name] && !bad) bad = label(c.name) + ' is required';
    });
    if (bad) return toast(bad, true);
    if (tab !== 'Trips') out.TripID = S.tripId;
    if (existing) out[IDCOL[tab]] = existing[IDCOL[tab]];

    try {

      if (tab === 'Trips' && !existing) await loadAll(saved.TripID, true);
      render(); renderChrome();
    } catch(e){ toast(errMsg(e), true); $('#fs') && ($('#fs').disabled = false); }

/* ---------- budget engine (see "How costs are counted" on the Budget page) ---------- */
function budgetCalc(){
  const today = todayStr(), ents = [], notes = [];
  const bookings = S.data.Bookings.filter(b => b.BookingStatus !== 'Cancelled');
  const exp = S.data.Expenses;
  const paidFor = id => sum(exp.filter(e => e.BookingID === id), e => toAud(e.Amount,e.Currency,e.AmountAUD));
  bookings.forEach(b => {
    const cost = toAud(b.Cost,b.Currency,b.CostAUD), paid = paidFor(b.BookingID), fc = Math.max(cost,paid);
    ents.push({kind: b.BookingStatus === 'Booked' ? 'committed' : 'planned', amt: fc, cat: BOOKING_TO_BUDGET[b.Category] || 'Other', dest: b.DestinationID, paid, label: b.Description});
  });
  const bookingIds = new Set(S.data.Bookings.map(b => b.BookingID));
  S.data.Itinerary.forEach(it => {
    if (it.BookingID && bookingIds.has(it.BookingID)) return;
    if (it.BookingStatus === 'Booked' && false) return;
    if (it.Date && it.Date < today) return;
    const amt = toAud(it.EstimatedCost,it.Currency); if (!amt) return;
    ents.push({kind:'planned', amt, cat: ITEM_TO_BUDGET[it.ItemType] || 'Other', dest: it.DestinationID, label: it.Title});
  });
  const onItin = new Set(S.data.Itinerary.map(i => i.PlaceID).filter(Boolean));
  S.data.Places.forEach(p => {
    if (p.Status !== 'Shortlisted' || onItin.has(p.PlaceID)) return;
    const amt = toAud(p.EstimatedCost,p.Currency); if (!amt) return;
    ents.push({kind:'planned', amt, cat: p.Category === 'Restaurants' || p.Category === 'Cafes' ? 'Food and drinks' : p.Category === 'Shopping' ? 'Shopping' : 'Activities', dest: p.DestinationID, label: p.Name});
  });
  exp.filter(e => !e.BookingID || !bookingIds.has(e.BookingID)).forEach(e => ents.push({kind:'direct', amt: toAud(e.Amount,e.Currency,e.AmountAUD), cat: e.Category || 'Other', dest: e.DestinationID, label: e.Description}));
  const planned = sum(ents.filter(e => e.kind === 'planned'), e => e.amt), committed = sum(ents.filter(e => e.kind === 'committed'), e => e.amt), direct = sum(ents.filter(e => e.kind === 'direct'), e => e.amt);
  const spentList = exp.map(e => ({amt: toAud(e.Amount,e.Currency,e.AmountAUD), cat: e.Category || (rec('Bookings',e.BookingID) ? BOOKING_TO_BUDGET[rec('Bookings',e.BookingID).Category] : 'Other'), dest: e.DestinationID || (rec('Bookings',e.BookingID)||{}).DestinationID, date: e.Date}));
  const spent = sum(spentList, x => x.amt), forecast = planned + committed + direct;
  const paidOnBooked = sum(ents.filter(e => e.kind === 'committed'), e => e.paid || 0);
  const t = tripObj(), budget = Number(t && t.Budget) || 0;
  return {ents, spentList, planned, committed, direct, forecast, spent, budget, outstanding: Math.max(0, committed - paidOnBooked), remaining: budget - forecast, cashLeft: budget - spent};
}
function groupSum(list,key,val){ const m = {}; list.forEach(x => { const k = key(x) || ''; m[k] = (m[k] || 0) + val(x); }); return m; }

/* ---------- itinerary model ---------- */
function allEvents(){
  const evs = S.data.Itinerary.map(i => Object.assign({}, i, {src:'itin'}));
  S.data.Bookings.filter(b => b.BookingStatus !== 'Cancelled' && TRANSPORT_CATS.includes(b.Category) && b.StartDate)
    .filter(b => !S.data.Itinerary.some(i => i.BookingID === b.BookingID))
    .forEach(b => evs.push({src:'booking', ItineraryID:b.BookingID, Date:b.StartDate, StartTime:b.StartTime, EndTime:b.EndTime, Title:`${b.Category.replace(/s$/,'')}: ${b.Description}`, ItemType:'Transport',
      DestinationID:b.DestinationID, TransportType:b.Category === 'Flights' ? 'Flight' : b.Category === 'Trains' ? 'Train' : b.Category === 'Buses' ? 'Bus' : 'Transfer', BookingID:b.BookingID, BookingStatus:b.BookingStatus, Notes:b.Notes, EstimatedCost:b.Cost, Currency:b.Currency}));
  return evs;
}
const evSort = (a,b) => String(a.Date).localeCompare(String(b.Date)) || (a.StartTime ? (b.StartTime ? a.StartTime.localeCompare(b.StartTime) : -1) : (b.StartTime ? 1 : 0)) || ((Number(a.SortOrder)||0) - (Number(b.SortOrder)||0));
function destOnDate(date){
  let hit = null; dests().forEach(d => { if (d.ArrivalDate && d.ArrivalDate <= date && (!d.DepartureDate || date <= d.DepartureDate)) hit = d; }); return hit;
}
function lodging(date){
  const b = S.data.Bookings.find(b => b.Category === 'Accommodation' && b.BookingStatus !== 'Cancelled' && b.StartDate && b.StartDate <= date && (b.EndDate ? date < b.EndDate : date === b.StartDate));
  if (b) return b.Description + (b.Provider ? ' · ' + b.Provider : '');
  const d = destOnDate(date); return d && d.Accommodation || '';
}
function tripDates(){
  const t = tripObj(), set = new Set(allEvents().map(e => e.Date).filter(Boolean));
  if (t && t.StartDate && t.EndDate) for (let d = t.StartDate; d <= t.EndDate && diffDays(t.StartDate,d) < 400; d = addDays(d,1)) set.add(d);
  return [...set].sort();
}

PAGES.itinerary = function(){

  else if (S.itinView === 'days') {
    body = `<div class="grid g2">${dates.map(d => ({d, e: evs.filter(e => e.Date === d && matchDest(e,d))})).filter(x => !S.f.dest || x.e.length || (destOnDate(x.d)||{}).DestinationID === S.f.dest).map(x => dayCard(x.d,x.e)).join('')}</div>`;
    const undated = evs.filter(e => !e.Date); if (undated.length) body += `<h3 style="margin:16px 0 8px">Unscheduled</h3><div class="card">${undated.map(eventRow).join('')}</div>`;

    const sh = evs.filter(e => e.Date && matchDest(e,e.Date));
    body = sh.length ? `<div class="card"><div class="tl">${sh.map((e,i) => `${i === 0 || sh[i-1].Date !== e.Date ? `<div class="ev" style="padding-top:${i ? 8 : 0}px"><b>${esc(fmtDate(e.Date))}</b> <span class="xs mute">${dayNo(e.Date) ? 'Day ' + dayNo(e.Date) : ''}</span></div>` : ''}<div class="ev">${eventRow(e)}</div>`).join('')}</div></div>` : '<div class="card empty">No activities yet.</div>';

    const [y,m] = S.calMonth.split('-').map(Number), first = new Date(Date.UTC(y,m-1,1)), lead = (first.getUTCDay() + 6) % 7, days = new Date(Date.UTC(y,m,0)).getUTCDate();
    let cells = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="dow">${d}</div>`).join('') + '<div></div>'.repeat(lead);
    for (let i = 1; i <= days; i++) {
      const ds_ = `${y}-${pad(m)}-${pad(i)}`, n = evs.filter(e => e.Date === ds_).length, inTrip = t && t.StartDate && ds_ >= t.StartDate && ds_ <= t.EndDate;

    body = `<div class="card"><div class="row between" style="margin-bottom:10px"><button class="btn sm" data-act="calMonth" data-m="${prev}">‹</button><b>${esc(first.toLocaleDateString('en-AU',{month:'long',year:'numeric',timeZone:'UTC'}))}</b><button class="btn sm" data-act="calMonth" data-m="${next}">›</button></div><div class="cal">${cells}</div></div>`

    <div class="row wrap">${linkBtn(b.ConfirmationUrl,'Confirmation')}${b.BookingStatus === 'Booked' ? `<button class="btn sm" data-act="pay" data-id="${esc(b.BookingID)}">${ico('budget')} Record payment</button>` : ''}<span class="spacer"></span>${editDel('Bookings',b.BookingID)}</div></div>`;
  return head('Bookings', addBtn('Bookings',null,'Booking')) +
    (quick.length ? `<div class="card flat" style="margin-bottom:14px"><h3>Quick access</h3><div class="list">${quick.map(b => `<div class="row"><span style="flex:1"><b>${esc(b.Description)}</b><div class="xs mute">${esc(fmtShort(b.StartDate) || 'Date TBC')}</div></span>${b.ConfirmationRef ? `<span class="ref mono">${esc(b.ConfirmationRef)}</span><button class="btn sm" data-act="copy" data-text="${esc(b.ConfirmationRef)}">${ico('copy')}</button>` : ''}${linkBtn(b.ConfirmationUrl,'Open')}</div>`).join('')}</div></div>` : '') +
    `<div class="filters">${searchBox('Search bookings or reference')}${sel('bst',['Researching','Planned','Booked','Cancelled'],'Any status')}${sel('bcat',cats,'All categories')}</div>
    <div class="grid g2">${list.map(card).join('') || '<div class="card empty">No bookings yet.</div>'}</div>`;
};

PAGES.tasks = function(){
  const f = S.f, cats = S.schema.Tasks.columns.find(c => c.name === 'Category').enums, today = todayStr();
  const list = S.data.Tasks.filter(x => (!f.tst || (f.tst === 'open' ? x.Status !== 'Done' && x.Status !== 'Skipped' : x.Status === f.tst)) && (!f.tcat || x.Category === f.tcat) && matchQ(x,['Description','Notes']))
    .sort((a,b) => (a.Status === 'Done') - (b.Status === 'Done') || String(a.DueDate||'9999').localeCompare(String(b.DueDate||'9999')));
  const done = S.data.Tasks.filter(x => x.Status === 'Done').length, total = S.data.Tasks.length;
  return head('Preparation', addBtn('Tasks',null,'Task')) +
    `<div class="card" style="margin-bottom:14px"><div class="row between sm"><span>${done} of ${total} complete</span><span class="mute">${total ? Math.round(done / total * 100) : 0}%</span></div><div class="progress" style="margin-top:8px"><i style="width:${total ? done / total * 100 : 0}%"></i></div></div>
    <div class="filters">${searchBox('Search tasks')}${sel('tst',[['open','Outstanding'],'To do','In progress','Done','Skipped'],'All')}${sel('tcat',cats,'All categories')}</div>
    <div class="card"><div class="list">${list.map(x => `<div class="row"><button class="chk ${x.Status === 'Done' ? 'on' : ''}" data-act="toggleTask" data-id="${esc(x.TaskID)}" aria-label="Toggle done">${x.Status === 'Done' ? ico('check') : ''}</button>
      <div style="flex:1;min-width:0" class="${x.Status === 'Done' ? 'done' : ''}"><div>${esc(x.Description)}</div><div class="xs mute">${esc(x.Category || '')}${x.DueDate ? ` · <span style="${x.DueDate < today && x.Status !== 'Done' ? 'color:var(--bad)' : ''}">due ${esc(fmtShort(x.DueDate))}</span>` : ''}${x.Notes ? ' · ' + esc(x.Notes) : ''}</div></div>${badge(x.Priority)}${editDel('Tasks',x.TaskID)}</div>`).join('') || '<div class="empty">No tasks match.</div>'}</div></div>`;
};

PAGES.budget = function(){
  const B = budgetCalc(), t = tripObj(), today = todayStr(), ph = phase();
  const cats = S.schema.Expenses.columns.find(c => c.name === 'Category').enums;
  const byCatF = groupSum(B.ents, e => e.cat, e => e.amt), byCatS = groupSum(B.spentList, e => e.cat, e => e.amt);
  const maxC = Math.max(1, ...cats.map(c => Math.max(byCatF[c] || 0, byCatS[c] || 0)));
  const byDestF = groupSum(B.ents, e => e.dest, e => e.amt), byDestS = groupSum(B.spentList, e => e.dest, e => e.amt);
  const destIds = [...new Set([...Object.keys(byDestF), ...Object.keys(byDestS)])];
  const maxD = Math.max(1, ...destIds.map(k => Math.max(byDestF[k] || 0, byDestS[k] || 0)));
  const dur = t.StartDate && t.EndDate ? diffDays(t.StartDate,t.EndDate) + 1 : null;
  const elapsed = ph === 'underway' ? diffDays(t.StartDate,today) + 1 : ph === 'completed' ? dur : null;
  const avgSpent = elapsed ? B.spent / elapsed : null, avgPlan = dur ? B.forecast / dur : null;
  const pct = B.budget ? Math.min(100, B.forecast / B.budget * 100) : 0, sp = B.budget ? Math.min(100, B.spent / B.budget * 100) : 0;
  const exps = S.data.Expenses.slice().sort((a,b) => String(b.Date).localeCompare(String(a.Date)));
  const bar = (name,f,s,max) => `<div class="br"><span class="${name ? '' : 'mute'}">${esc(name || 'Unassigned')}</span><div><div class="progress"><i style="width:${f / max * 100}%"></i></div><div class="progress" style="margin-top:3px"><i style="width:${s / max * 100}%;background:var(--accent2)"></i></div></div><span class="xs" style="text-align:right">${aud(f)}<br><span style="color:var(--accent2)">${aud(s)}</span></span></div>`;
  const rates = sorted(S.data.ExchangeRates,'Currency');
  return head('Budget', `${addBtn('Expenses',{Date:today},'Expense')}`) +
  `${missingFx ? `<div class="card flat" style="margin-bottom:14px;border-color:var(--warn)">Note: ${missingFx} amount(s) have no exchange rate and are counted as $0. Add rates below.</div>` : ''}
  <div class="card stack"><div class="kv"><div class="stat"><span class="xs mute">Budget</span><b>${B.budget ? aud(B.budget) : '–'}</b></div><div class="stat"><span class="xs mute">Forecast total</span><b>${aud(B.forecast)}</b></div><div class="stat"><span class="xs mute">Spent so far</span><b style="color:var(--accent2)">${aud(B.spent)}</b></div><div class="stat"><span class="xs mute">Remaining (vs forecast)</span><b style="color:${B.remaining < 0 ? 'var(--bad)' : 'var(--good)'}">${B.budget ? aud(B.remaining) : '–'}</b></div></div>
   ${B.budget ? `<div class="progress ${B.forecast > B.budget ? 'over' : ''}"><i style="width:${pct}%"></i><span class="mark" style="left:${sp}%"></span></div><div class="xs mute">Bar = forecast; white marker = spent. Cash left after spending: ${aud(B.cashLeft)}</div>` : '<div class="sm mute">Edit the trip to set a budget.</div>'}
   <div class="kv"><div class="stat"><span class="xs mute">Planned (estimates)</span><b>${aud(B.planned)}</b></div><div class="stat"><span class="xs mute">Committed (booked)</span><b>${aud(B.committed)}</b></div><div class="stat"><span class="xs mute">Still to pay on bookings</span><b>${aud(B.outstanding)}</b></div><div class="stat"><span class="xs mute">${elapsed ? 'Avg spent / day' : 'Avg forecast / day'}</span><b>${aud(elapsed ? avgSpent : avgPlan)}</b></div></div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>By category <span class="xs">forecast · <span style="color:var(--accent2)">spent</span></span></h3><div class="bars">${cats.map(c => bar(c,byCatF[c] || 0,byCatS[c] || 0,maxC)).join('')}</div></div>
    <div class="card"><h3>By destination</h3><div class="bars">${destIds.map(k => bar(destName(k),byDestF[k] || 0,byDestS[k] || 0,maxD)).join('') || '<div class="mute sm">Nothing assigned to destinations yet.</div>'}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Expenses & payments</h3><div class="list">${exps.map(e => { const b = rec('Bookings',e.BookingID); return `<div class="row"><span style="flex:1;min-width:0"><b>${esc(e.Description)}</b><div class="xs mute">${esc(fmtShort(e.Date))}${e.Category ? ' · ' + esc(e.Category) : ''}${b ? ' · payment for ' + esc(b.Description) : ''}</div></span><span style="text-align:right"><b>${aud(toAud(e.Amount,e.Currency,e.AmountAUD))}</b>${e.Currency !== 'AUD' ? `<div class="xs mute">${esc(num(e.Amount,e.Currency))}</div>` : ''}</span>${editDel('Expenses',e.ExpenseID)}</div>`; }).join('') || '<div class="mute sm">No expenses recorded.</div>'}</div></div>
  <div class="card" style="margin-top:14px"><h3>Exchange rates ${addBtn('ExchangeRates',{EffectiveDate:today},'Rate')}</h3><table class="t"><tr><th>Currency</th><th>AUD per 1 unit</th><th>From</th><th></th></tr>${rates.map(r => `<tr><td>${esc(r.Currency)}</td><td>${esc(r.RateToAUD)}</td><td>${esc(r.EffectiveDate)}</td><td style="text-align:right">${editDel('ExchangeRates',r.RateID)}</td></tr>`).join('')}</table>
  <p class="xs mute">Entered manually. A booking or expense keeps the rate it was saved with; estimates use the latest rate.</p></div>
  <details class="card flat" style="margin-top:14px"><summary style="cursor:pointer;font-weight:700">How costs are counted (no double counting)</summary><div class="sm mute stack" style="margin-top:10px">
   <p><b>Planned</b>: estimates on future itinerary items and shortlisted places, plus bookings still Researching/Planned. <b>Committed</b>: bookings marked Booked. <b>Payments</b>: expenses linked to a booking, which settle that booking and are not extra spend. <b>Direct spend</b>: expenses with no booking.</p>
   <p>Each booking counts once as the larger of its cost and the payments made. Itinerary items linked to a booking, and places already on the itinerary, are skipped. Past-dated itinerary estimates drop out once their day has passed (the real cost should be an expense). Cancelled bookings count as $0.</p>
   <p><b>Forecast</b> = planned + committed + direct. <b>Spent</b> = all payments + direct expenses.</p></div></details>`;
};

PAGES.trips = function(){
  const act = S.trips.filter(t => t.Status !== 'Archived' && t.Status !== 'Completed'), hist = S.trips.filter(t => t.Status === 'Archived' || t.Status === 'Completed');
  const card = t => `<div class="card stack"><div class="row between"><div><h2 style="font-size:18px">${esc(t.TripName)}</h2><div class="sm mute">${esc(t.Countries || '')}</div></div>${badge(t.Status)}</div>
    <div class="sm">${t.StartDate ? esc(fmtDate(t.StartDate)) + ' → ' + esc(fmtDate(t.EndDate)) : 'Dates TBC'} ${badge(t.DateStatus)}</div><div class="xs mute">${t.Budget !== '' ? 'Budget ' + esc(num(t.Budget,t.Currency)) : 'No budget'} · ${esc(t.Travellers || '')} travellers</div>
    <div class="row wrap">${t.TripID === S.tripId ? '<span class="badge good">Selected</span>' : `<button class="btn sm pri" data-act="pickTrip" data-id="${esc(t.TripID)}">Open</button>`}
    ${t.Status === 'Archived' ? `<button class="btn sm" data-act="setTripStatus" data-id="${esc(t.TripID)}" data-s="Completed">Unarchive</button>` : `<button class="btn sm" data-act="setTripStatus" data-id="${esc(t.TripID)}" data-s="Archived">Archive</button>`}<span class="spacer"></span>${editDel('Trips',t.TripID)}</div></div>`;
  return head('Trips', addBtn('Trips',{Currency:'AUD',Travellers:2,Status:'Planning',DateStatus:'Provisional'},'New trip')) +
    `<div class="grid g2">${act.map(card).join('') || '<div class="card empty">No active trips.</div>'}</div>` +
    (hist.length ? `<h3 style="margin:22px 0 10px">History</h3><div class="grid g2">${hist.map(card).join('')}</div>` : '');
};

/* ---------- events ---------- */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); } catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(_){} ta.remove();
  }
  toast('Copied ' + text);
}
const ACTS = {
  nav: d => nav(d.page),
  saveApi: () => {
    const v = ($('#apiurl').value || '').trim().split('?')[0];
    if (!v.startsWith('https:') || !v.includes('/macros/s/') || !v.endsWith('/exec')) return toast('That does not look like a web app link ending in /exec', true);
    store('tb_api', v); store('tb_cache', ''); loadAll('', true);
  },
  theme: () => { store('tb_theme', curTheme() === 'light' ? 'dark' : 'light'); applyTheme(); renderChrome(); },
  more: () => showModal(`<h2>More</h2><div class="sheetlist">${NAV.filter(n => !TAB_MAIN.includes(n[0])).map(n => `<button class="navbtn" data-act="nav" data-page="${n[0]}">${ico(n[2])}${n[1]}</button>`).join('')}</div><button class="btn ghost" data-act="closeModal" style="width:100%">Close</button>`),
  closeModal,
  scrim: (d,el,ev) => { if (ev.target === el) closeModal(); },
  refresh: () => loadAll(S.tripId),
  add: d => openForm(d.tab, null, d.defaults ? JSON.parse(d.defaults) : null),
  edit: d => { const r = rec(d.tab,d.id); if (r) openForm(d.tab, r); },
  del: async d => { const r = rec(d.tab,d.id); if (!r) return;
    const extra = d.tab === 'Trips' ? ' This also deletes ALL of its destinations, itinerary, bookings, expenses and tasks.' : d.tab === 'Destinations' ? ' Items using it will be left without a destination.' : '';
    if (await confirmDlg('Delete this ' + tabLabel(d.tab) + '?', 'This removes it from the Google Sheet and cannot be undone.' + extra)) deleteRecord(d.tab,d.id); },
  copy: d => copyText(d.text),
  setf: d => { S.f[d.k] = d.v; render(); },
  itinView: d => { S.itinView = d.v; render(); },
  calMonth: d => { S.calMonth = d.m; render(); },
  calDay: d => { S.calDay = d.date; render(); },
  pickTrip: d => { S.f = {}; loadAll(d.id, true).then(() => nav('dashboard')); },
  setTripStatus: async d => { const t = rec('Trips',d.id); try { await saveRecord('Trips', {TripID:d.id, Status:d.s}, t.Version); toast(d.s === 'Archived' ? 'Archived' : 'Restored'); } catch(e){ toast(errMsg(e),true); } renderChrome(); render(); },
  toggleTask: async d => { const x = rec('Tasks',d.id); try { await saveRecord('Tasks', {TaskID:d.id, Status: x.Status === 'Done' ? 'To do' : 'Done'}, x.Version); } catch(e){ toast(errMsg(e),true); } render(); },
  pay: d => { const b = rec('Bookings',d.id); openForm('Expenses', null, {BookingID:b.BookingID, Description:'Payment: ' + b.Description, Category:BOOKING_TO_BUDGET[b.Category], Amount:b.Cost, Currency:b.Currency || 'AUD', DestinationID:b.DestinationID, Date:todayStr()}, async () => {
      const cur = rec('Bookings',b.BookingID); if (cur && cur.PaymentStatus === 'Unpaid') { try { await saveRecord('Bookings', {BookingID:cur.BookingID, PaymentStatus:'Deposit paid'}, cur.Version); } catch(e){} } }); },
  place2itin: d => { const p = rec('Places',d.id);
    openForm('Itinerary', null, {Title:p.Name, Description:p.Description, EstimatedCost:p.EstimatedCost, Currency:p.Currency, MapsUrl:p.MapsUrl, DestinationID:p.DestinationID, PlaceID:p.PlaceID, Priority:p.Priority, ItemType:'Activity', BookingStatus:'Planned'},
      async () => { const cur = rec('Places',p.PlaceID); try { await saveRecord('Places', {PlaceID:cur.PlaceID, Status:'Added to itinerary'}, cur.Version); } catch(e){} }); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTS[el.dataset.act]; if (fn) { if (el.tagName === 'A') return; fn(el.dataset, el, e); }
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.filter; if (k === 'q') { S.f.q = e.target.value; render(); } });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.filter; if (k && k !== 'q') { S.f[k] = e.target.value; render(); } });
$('#tripsel').addEventListener('change', e => { S.f = {}; loadAll(e.target.value, true); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- start: show the saved copy instantly, then fetch fresh data ---------- */
(function init(){
  applyTheme(); renderChrome();
  try { const q = new URLSearchParams(location.search).get('api'); if (q && !IN_GAS) store('tb_api', q.split('?')[0]); } catch(e){}
  try { const c = store('tb_cache'); if (c) applyBootstrap(JSON.parse(c), true); } catch(e){}
  loadAll(store('tb_trip') || '', true);
})();
</script>
